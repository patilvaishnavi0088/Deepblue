<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Aquarium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🐠 Deepblue</h1>

  

  <div id="aquarium"></div>

  <div id="sea-floor">
  <div class="seaweed" style="left: 5%;"></div>
  <div class="seaweed" style="left: 15%; animation-delay: 0.5s;"></div>
  <div class="seaweed" style="left: 30%; animation-delay: 1s;"></div>
  <div class="seaweed" style="left: 50%; animation-delay: 0.3s;"></div>
  <div class="seaweed" style="left: 70%; animation-delay: 0.8s;"></div>
  <div class="seaweed" style="left: 85%; animation-delay: 1.2s;"></div>
</div>

<div id="bubbles">
  <div class="bubble" style="left: 10%; animation-duration: 6s; animation-delay: 0s;"></div>
  <div class="bubble" style="left: 25%; animation-duration: 8s; animation-delay: 1s;"></div>
  <div class="bubble" style="left: 40%; animation-duration: 5s; animation-delay: 2s;"></div>
  <div class="bubble" style="left: 55%; animation-duration: 7s; animation-delay: 0.5s;"></div>
  <div class="bubble" style="left: 70%; animation-duration: 6.5s; animation-delay: 1.5s;"></div>
  <div class="bubble" style="left: 85%; animation-duration: 9s; animation-delay: 2.5s;"></div>
</div>
  <script src="script.js"></script>
</body>
</html>
